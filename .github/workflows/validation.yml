name: Validation

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  validation:
    name: Research validation gates
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      # pytest also discovers function-style numerical tests; GUI construction
      # is verified in the local Windows suite and requires a display.
      - name: Run headless tests
        run: >
          python -m pytest tests
          --ignore=tests/test_aurora_gui_smoke.py
          --deselect=tests/test_aurora_service.py::AuroraServiceScaffoldingTests::test_aurora_entrypoints_call_real_main_functions
          -q

      - name: Run formula oracle gate
        run: python tools/run_formula_oracles.py --output-dir run_reports/validation

      - name: Build comparator coverage matrix
        run: python tools/build_comparator_matrix.py --output-dir run_reports/validation

      - name: Build paper reproduction table
        run: python tools/build_paper_reproduction_table.py --output-dir run_reports/validation

      - name: Run non-strict clinical readiness guardrails
        run: python tools/run_clinical_readiness_gate.py --output-dir run_reports/validation

      - name: Check reference data availability
        id: reference_data
        shell: bash
        run: |
          if python - <<'PY'
          from pathlib import Path
          import yaml

          manifest = yaml.safe_load(Path("validation/reference_cases/manifest.yaml").read_text(encoding="utf-8"))
          missing = [
              case["source_path"]
              for case in manifest.get("cases", [])
              if not Path(case["source_path"]).exists()
          ]
          if missing:
              print("Missing reference RTPLAN data; skipping full artifact rebuild:")
              for path in missing:
                  print(f"  - {path}")
              raise SystemExit(1)
          PY
          then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run reference suite
        if: steps.reference_data.outputs.available == 'true'
        run: python tools/run_reference_suite.py --profile research --output-dir run_reports/validation

      - name: Run tool comparison
        if: steps.reference_data.outputs.available == 'true'
        run: python tools/run_tool_comparison.py --profile research --output-dir run_reports/validation

      - name: Build validation report
        if: steps.reference_data.outputs.available == 'true'
        run: python tools/build_validation_report.py --profile research --output-dir run_reports/validation
