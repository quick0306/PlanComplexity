- key: mcs5
  platform: VMAT_IMRT
  mode: VMAT_IMRT
  group_key: vmat_imrt_halcyon_ethos_tamura_2020
  metric_key: mcs5
  label: MCS5
  unit: dimensionless
  aggregation_scope: plan
  normalization_basis: At each effective positive jaw-clipped gap assign its left/right limiting raw edge
    to the tighter layer; ties share 1/2 (math.isclose, abs_tol=1e-6 plus Python default relative tolerance).
    w_layer=limiting-edge score/(2*Nactive); u_layer excludes tied edges from this numerator. E=sum_slot
    max(0,max_CP raw_right-min_CP raw_left)*max_CP exposed_height, over CPs where that slot is not outside
    jaws; this max-slot bank envelope is not a geometric union. Each bank uses R=max(x)-min(x), not max
    adjacent difference; 1-sum(abs(diff(x)))/((n-1)*R); two bank scores multiply. Active indices are compressed
    before differences. Let t_layer=mean_endpoint(A/E)*mean_endpoint(LSV). Layer MCSw=sum_norm_du t_layer*mean_endpoint(w_layer);
    MCSUL additionally multiplies mean_endpoint(u_layer). Unweighted MCS uses t_layer alone.
  validation_level: Reference-case exact
  comparison_class: exact-equivalent
  default_tolerance_abs: 1.0e-06
  default_tolerance_rel: 0.0001
  expected_range: &id006
    kind: unit_interval
    minimum: 0.0
    maximum: 1.0
  clinical_readiness: research
  known_noncomparability: &id001 []
  comparable_to: &id002 []
